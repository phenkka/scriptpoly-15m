services:
  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    container_name: analyzer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLY_BANKROLL_USD: ${POLY_BANKROLL_USD:-100}
      PRED_BANKROLL_USD: ${PRED_BANKROLL_USD:-100}
      MIN_STAKE_USD: ${MIN_STAKE_USD:-1}
      MIN_PROFIT_USD: ${MIN_PROFIT_USD:-0}
      TRADER_URL: ${TRADER_URL:-http://trader:9000/opportunity}
      TRADER_TIMEOUT_SEC: ${TRADER_TIMEOUT_SEC:-0.5}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  trader:
    build:
      context: .
      dockerfile: trader/Dockerfile
    container_name: trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADER_DRY_RUN: ${TRADER_DRY_RUN:-true}
      TRADER_MAX_TRADE_USD: ${TRADER_MAX_TRADE_USD:-1}
      TRADER_TIMEOUT_SEC: ${TRADER_TIMEOUT_SEC:-2.0}
      TRADER_TRADES_FILE: ${TRADER_TRADES_FILE:-/data/trades.jsonl}
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY}
      POLY_FUNDER: ${POLY_FUNDER}
      POLY_SIGNATURE_TYPE: ${POLY_SIGNATURE_TYPE:-0}
      POLY_API_KEY: ${POLY_API_KEY}
      POLY_SECRET: ${POLY_SECRET}
      POLY_PASSPHRASE: ${POLY_PASSPHRASE}
      PREDICT_API_KEY: ${PREDICT_API_KEY}
      PREDICT_PRIVATE_KEY: ${PREDICT_PRIVATE_KEY}
      PREDICT_ACCOUNT: ${PREDICT_ACCOUNT:-}
      BOT_NOTIFY_URL: ${BOT_NOTIFY_URL:-http://bot:8080/notify}
      ANALYZER_URL: http://analyzer:8000
      PREDICT_QUEUE_THRESHOLD_USD: ${PREDICT_QUEUE_THRESHOLD_USD:-20}
      PREDICT_HARD_MAX_QUEUE_USD: ${PREDICT_HARD_MAX_QUEUE_USD:-30}
      PREDICT_MAX_QUOTE_AGE_SEC: ${PREDICT_MAX_QUOTE_AGE_SEC:-3}
      BA_MAX_POLY_BOOK_AGE_MS: ${BA_MAX_POLY_BOOK_AGE_MS:-0}
      BA_MAX_PRED_BOOK_AGE_MS: ${BA_MAX_PRED_BOOK_AGE_MS:-0}
      PREDICT_MIN_EXPIRY_BUFFER_SEC: ${PREDICT_MIN_EXPIRY_BUFFER_SEC:-120}
      PREDICT_UNWIND_BUDGET_SEC: ${PREDICT_UNWIND_BUDGET_SEC:-120}
      PREDICT_SELL_INDEX_WAIT_SEC: ${PREDICT_SELL_INDEX_WAIT_SEC:-60}
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data

  balancer:
    build:
      context: .
      dockerfile: balancer/Dockerfile
    container_name: balancer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY}
      POLY_FUNDER: ${POLY_FUNDER:-}
      PREDICT_PRIVATE_KEY: ${PREDICT_PRIVATE_KEY}
      BALANCER_POLY_WALLET: ${BALANCER_POLY_WALLET:-0x187042aEF3a09C534E76612440ED086e58c9ACaD}
      BALANCER_PREDICT_WALLET: ${BALANCER_PREDICT_WALLET:-0x1b7FD55c2D2c243CE917eb998f12CDEB9E686Fc9}
      BALANCER_THRESHOLD_USD: ${BALANCER_THRESHOLD_USD:-10}
      BALANCER_TARGET_USD: ${BALANCER_TARGET_USD:-25}
      BALANCER_ENABLE_TRANSFERS: ${BALANCER_ENABLE_TRANSFERS:-false}
      BALANCER_INTERVAL_SEC: ${BALANCER_INTERVAL_SEC:-30}
      BALANCER_COOLDOWN_SEC: ${BALANCER_COOLDOWN_SEC:-600}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com}
      BSC_USDT_ADDRESS: ${BSC_USDT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      POLYGON_PUSD_ADDRESS: ${POLYGON_PUSD_ADDRESS:-0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb}
      POLYGON_USDCE_ADDRESS: ${POLYGON_USDCE_ADDRESS:-0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174}
      BOT_NOTIFY_URL: ${BOT_NOTIFY_URL:-http://bot:8080/notify}
      TRADER_SUCCESS_TRADES_FILE: ${TRADER_SUCCESS_TRADES_FILE:-/data/trades_success.jsonl}
      BOT_STOP_TOTAL_USD: ${BOT_STOP_TOTAL_USD:-25}
    volumes:
      - ./data:/data
    ports:
      - "8081:8081"

  collect_polymarket:
    build:
      context: .
      dockerfile: collect/Dockerfile
    container_name: collect-polymarket
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANALYZER_URL: http://analyzer:8000/ingest
    command: ["python", "-m", "collect.btc_orderbook"]
    volumes:
      - ./data:/data

  collect_predict:
    build:
      context: .
      dockerfile: collect/Dockerfile
    container_name: collect-predict
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANALYZER_URL: http://analyzer:8000/ingest
      PREDICT_API_KEY: ${PREDICT_API_KEY_2}
    command: ["python", "-m", "collect.predict_orderbook"]

  claimer:
    build:
      context: .
      dockerfile: claimer/Dockerfile
    container_name: claimer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY}
      POLY_FUNDER: ${POLY_FUNDER:-}
      PREDICT_PRIVATE_KEY: ${PREDICT_PRIVATE_KEY}
      PREDICT_ACCOUNT: ${PREDICT_ACCOUNT:-}
      PREDICT_API_KEY: ${PREDICT_API_KEY}
      BALANCER_POLY_WALLET: ${BALANCER_POLY_WALLET:-0x187042aEF3a09C534E76612440ED086e58c9ACaD}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com}
      TRADER_TRADES_FILE: ${TRADER_TRADES_FILE:-/data/trades.jsonl}
      POLY_API_KEY: ${POLY_API_KEY:-}
      POLY_SECRET: ${POLY_SECRET:-}
      POLY_PASSPHRASE: ${POLY_PASSPHRASE:-}
      CLAIMER_INTERVAL_SEC: ${CLAIMER_INTERVAL_SEC:-60}
      CLAIMER_DRY_RUN: ${CLAIMER_DRY_RUN:-false}
      BOT_NOTIFY_URL: ${BOT_NOTIFY_URL:-http://bot:8080/notify}
    volumes:
      - ./data:/data

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TRADER_TRADES_FILE: ${TRADER_TRADES_FILE:-/data/trades.jsonl}
      INCIDENTS_FILE: ${INCIDENTS_FILE:-/data/incidents.jsonl}
      CLAIMS_FILE: ${CLAIMS_FILE:-/data/claims.jsonl}
      BOT_PORT: ${BOT_PORT:-8080}
      PROXY_URL: ${PROXY_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data