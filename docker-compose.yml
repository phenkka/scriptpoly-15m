services:
  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    container_name: analyzer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLY_BANKROLL_USD: ${POLY_BANKROLL_USD:-100}
      PRED_BANKROLL_USD: ${PRED_BANKROLL_USD:-100}
      MIN_STAKE_USD: ${MIN_STAKE_USD:-1}
      MIN_PROFIT_USD: ${MIN_PROFIT_USD:-0}
      TRADER_URL: ${TRADER_URL:-http://trader:9000/opportunity}
      TRADER_TIMEOUT_SEC: ${TRADER_TIMEOUT_SEC:-0.5}
    ports:
      - "8000:8000"

  trader:
    build:
      context: .
      dockerfile: trader/Dockerfile
    container_name: trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADER_DRY_RUN: ${TRADER_DRY_RUN:-true}
      TRADER_MAX_TRADE_USD: ${TRADER_MAX_TRADE_USD:-1}
      TRADER_TIMEOUT_SEC: ${TRADER_TIMEOUT_SEC:-2.0}
      TRADER_TRADES_FILE: ${TRADER_TRADES_FILE:-/data/trades.jsonl}
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY}
      POLY_FUNDER: ${POLY_FUNDER}
      POLY_SIGNATURE_TYPE: ${POLY_SIGNATURE_TYPE:-0}
      POLY_API_KEY: ${POLY_API_KEY}
      POLY_SECRET: ${POLY_SECRET}
      POLY_PASSPHRASE: ${POLY_PASSPHRASE}
      PREDICT_API_KEY: ${PREDICT_API_KEY}
      PREDICT_PRIVATE_KEY: ${PREDICT_PRIVATE_KEY}
      PREDICT_ACCOUNT: ${PREDICT_ACCOUNT:-}
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data

  collect_polymarket:
    build:
      context: .
      dockerfile: collect/Dockerfile
    container_name: collect-polymarket
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANALYZER_URL: http://analyzer:8000/ingest
    command: ["python", "-m", "collect.btc_orderbook"]

  collect_predict:
    build:
      context: .
      dockerfile: collect/Dockerfile
    container_name: collect-predict
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANALYZER_URL: http://analyzer:8000/ingest
      PREDICT_API_KEY: ${PREDICT_API_KEY}
    command: ["python", "-m", "collect.predict_orderbook"]